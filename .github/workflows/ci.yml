name: CI

on:
  push:
      branches:
       - main
  pull_request:
      branches:
       - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Deployment/app/requirements.txt
          python -m pip install -r Deployment/frontend/requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: |
          python -m pytest -q


  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest


    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: drone-catcher-backend
            contenxt: .
            dockerfile: Deployment/app/Dockerfile
          
          - image: drone-catcher-frontend
            contenxt: Deployment/frontend
            dockerfile: Deployment/frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to github container repository
        uses: docker/login-actions@v3
        with: 
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: ${{matrix.context}}
          file: ${{matrix.dockerfile}}
          tags: |
            ghcr.io/ptzatzag/${{matrix.image}}:latest
            ghcr.io/ptzatzag/${{matrix.image}}:${{github.sha}}