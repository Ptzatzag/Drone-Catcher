name: CI
on:
  push: 
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          python - m pip install --upgrade pip
          pip install pytest
        
      - name: Run tests
        run: | 
          python -m pytest -q
  
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: drone-catcher
            context: .
            dockerfile: Deployment/app/Dockerfile

          - image: drone-catcher
            context: Deployment/frontend